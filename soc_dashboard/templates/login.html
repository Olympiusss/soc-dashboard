<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentrium SOC — Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0B0F1A;
            background-image:
                radial-gradient(at 20% 30%, rgba(59, 130, 246, 0.15) 0, transparent 50%),
                radial-gradient(at 80% 70%, rgba(6, 182, 212, 0.12) 0, transparent 50%),
                radial-gradient(at 50% 50%, rgba(79, 70, 229, 0.08) 0, transparent 50%);
            color: #E2E8F0;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 0 24px;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #1E3A8A, #3B82F6);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 32px rgba(59, 130, 246, 0.4);
        }

        .logo-icon svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #E2E8F0, #94A3B8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .logo-area p {
            font-size: 0.85rem;
            color: #64748B;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #94A3B8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .otp-input-wrapper {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .otp-digit {
            width: 52px;
            height: 60px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            font-family: 'Inter', monospace;
            color: #F1F5F9;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(100, 116, 139, 0.3);
            border-radius: 14px;
            outline: none;
            transition: all 0.2s ease;
            caret-color: #3B82F6;
        }

        .otp-digit:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background: rgba(30, 41, 59, 1);
        }

        .otp-digit::selection {
            background: rgba(59, 130, 246, 0.3);
        }

        .hidden-input { position: absolute; opacity: 0; pointer-events: none; }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .btn-verify {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1E3A8A, #2563EB);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
            letter-spacing: 0.3px;
        }

        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgba(37, 99, 235, 0.5);
        }

        .btn-verify:active { transform: translateY(0); }

        .footer-text {
            text-align: center;
            margin-top: 28px;
            font-size: 0.78rem;
            color: #475569;
            font-weight: 500;
        }

        .footer-text span {
            color: #3B82F6;
            font-weight: 700;
        }

        /* No-config warning */
        .config-warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #FCD34D;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v5.7c0 4.83-3.23 9.36-7 10.58-3.77-1.22-7-5.75-7-10.58V6.3l7-3.12zM11 7v6h2V7h-2zm0 8v2h2v-2h-2z"/>
                    </svg>
                </div>
                <h1>Sentrium SOC Dashboard</h1>
                <p>Security Operations Center</p>
            </div>

            {% if not totp_configured %}
            <div class="config-warning">
                ⚠️ TOTP not configured. Add <strong>TOTP_SECRET</strong> to your <strong>.env</strong> file.<br>
                Authentication is bypassed in dev mode.
            </div>
            {% endif %}

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login" id="login-form">
                <div class="form-group">
                    <label>Verification Code</label>
                    <div class="otp-input-wrapper">
                        <input type="text" class="otp-digit" maxlength="1" data-index="0" autocomplete="off" inputmode="numeric">
                        <input type="text" class="otp-digit" maxlength="1" data-index="1" autocomplete="off" inputmode="numeric">
                        <input type="text" class="otp-digit" maxlength="1" data-index="2" autocomplete="off" inputmode="numeric">
                        <input type="text" class="otp-digit" maxlength="1" data-index="3" autocomplete="off" inputmode="numeric">
                        <input type="text" class="otp-digit" maxlength="1" data-index="4" autocomplete="off" inputmode="numeric">
                        <input type="text" class="otp-digit" maxlength="1" data-index="5" autocomplete="off" inputmode="numeric">
                    </div>
                    <input type="hidden" name="totp_code" id="totp_code">
                </div>
                <button type="submit" class="btn-verify">Verify & Access Dashboard</button>
            </form>

            <div class="footer-text">
                Secured by <span>Sentrium Security</span>
            </div>
        </div>
    </div>

    <script>
        const digits = document.querySelectorAll('.otp-digit');
        const hiddenInput = document.getElementById('totp_code');
        const form = document.getElementById('login-form');

        function updateHidden() {
            hiddenInput.value = Array.from(digits).map(d => d.value).join('');
        }

        digits.forEach((input, i) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value.replace(/\D/g, '');
                e.target.value = val.slice(-1);
                updateHidden();
                if (val && i < 5) digits[i + 1].focus();
                if (hiddenInput.value.length === 6) form.submit();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) {
                    digits[i - 1].focus();
                    digits[i - 1].value = '';
                    updateHidden();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasted = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
                pasted.split('').forEach((char, j) => {
                    if (digits[j]) digits[j].value = char;
                });
                updateHidden();
                if (pasted.length === 6) form.submit();
                else if (digits[pasted.length]) digits[pasted.length].focus();
            });
        });

        // Auto-focus first digit
        digits[0].focus();
    </script>
</body>
</html>
